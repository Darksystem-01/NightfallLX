[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nightfalllx"
version = "1.0.0"
description = "AI-assisted web vulnerability assessment framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Darksystem-01" }]
keywords = ["security", "pentest", "vulnerability", "scanner", "bugbounty"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "cryptography>=42.0",
]

[project.scripts]
nightfalllx = "nightfalllx.cli:main"

[tool.setuptools]
packages = [
    "nightfalllx",
    "nightfalllx.core",
    "nightfalllx.modules",
    "nightfalllx.reporters",
    "nightfalllx.integrations",
]
py-modules = ["nightfalllx_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "nightfalllx_legacy.py", "loot", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["nightfalllx"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["nightfalllx_legacy.py"]
