name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v -count=1 ./...

      - name: Build Binary
        run: go build -v -ldflags="-s -w" -o nightfalllx .
